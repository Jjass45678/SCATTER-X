    .reels-frame { background:#0a0e1a; border:2px solid var(--border); border-radius:18px; padding:18px; width:100%; max-width:560px; box-shadow:inset 0 0 30px rgba(0,0,0,.5); position:relative; overflow:hidden; }
    .reels-frame::before { content:''; position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); height:62px; border-top:2px solid rgba(0,245,160,.3); border-bottom:2px solid rgba(0,245,160,.3); z-index:2; pointer-events:none; box-shadow:0 0 18px rgba(0,245,160,.1); }
    .reels { display:flex; justify-content:center; gap:8px; }
    .reel { width:72px; height:180px; overflow:hidden; position:relative; border-radius:10px; background:#06091a; border:1px solid var(--border); }
    .reel-strip { display:flex; flex-direction:column; transition:transform .5s cubic-bezier(.2,.8,.3,1); }
    .sym { width:72px; height:60px; display:flex; align-items:center; justify-content:center; font-size:2rem; }
    .sym.highlight { background:rgba(0,245,160,.08); border-radius:8px; }
    .payline-info { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
    .pi { font-size:.65rem; background:rgba(255,255,255,.04); border-radius:6px; padding:3px 8px; color:var(--muted); }
    .pi em { color:var(--gem); font-style:normal; font-weight:700; }
    .win-banner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,14,26,.85); z-index:5; opacity:0; pointer-events:none; transition:opacity .3s; border-radius:16px; }
    .win-banner.show { opacity:1; pointer-events:auto; }
    .win-banner-inner { text-align:center; }
    .wb-amt { font-family:'Orbitron',sans-serif; font-size:1.6rem; font-weight:900; color:var(--gem); text-shadow:0 0 16px rgba(0,245,160,.3); }
    .wb-sub { font-size:.75rem; color:var(--muted); margin-top:4px; }
    .free-badge { background:linear-gradient(135deg,#ff6b00,#ff3b5c); color:#fff; padding:4px 14px; border-radius:20px; font-size:.7rem; font-weight:600; display:inline-block; margin-top:8px; }
    .auto-row { display:flex; gap:6px; }

<div class="page-wrap">
  <div class="game-layout">
    <div class="side">
      <div class="field-group">
        <div class="field-label">Bet Amount (₱)</div>
        <input type="number" class="field-input" id="betInp" value="5" min="1" />
        <div class="bet-quick">
          <button class="bq-btn" onclick="bq('h')">½</button>
          <button class="bq-btn" onclick="bq('2')">2×</button>
          <button class="bq-btn" onclick="bq('min')">Min</button>
          <button class="bq-btn" onclick="bq('max')">Max</button>
        </div>
      </div>
      <button class="btn-primary" id="spinBtn" onclick="spin()">🎰 SPIN</button>
      <div class="auto-row">
        <button class="btn-outline" id="autoBtn" onclick="toggleAuto()">▶ AUTO</button>
        <input type="number" class="field-input" id="autoCount" value="10" min="1" max="100" style="width:70px" />
      </div>
      <div class="info-box">
        <div class="i-lbl">Free Spins</div>
        <div class="i-val" id="freeDisp">0</div>
        <div class="i-sub">Get 3+ scatter symbols</div>
      </div>
      <div class="field-group">
        <div class="field-label">Paytable</div>
        <div class="payline-info" id="paytable"></div>
      </div>
    </div>

    <div class="game-board">
      <div class="board-status" id="status">Spin the reels to win!</div>
      <div class="reels-frame" id="reelsFrame">
        <div class="reels" id="reels"></div>
        <div class="win-banner" id="winBanner">
          <div class="win-banner-inner">
            <div class="wb-amt" id="wbAmt">₱0</div>
            <div class="wb-sub" id="wbSub"></div>
          </div>
        </div>
      </div>
      <div class="payline-info">
        <div class="pi">Middle row wins</div>
        <div class="pi">3+ matching = win</div>
        <div class="pi">⭐ = scatter / free spins</div>
      </div>
    </div>
  </div>
</div>

<script src="../js/wallet.js"></script>
<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script>
Wallet.init();
updateAuthUI();

const SYMS = ['🍒','🍋','🍊','🔔','💎','7️⃣','⭐'];
const WEIGHTS = [25,20,18,15,10,7,5];
const PAYS = { '🍒':{3:3,4:8,5:20}, '🍋':{3:4,4:12,5:30}, '🍊':{3:5,4:15,5:40}, '🔔':{3:8,4:25,5:60}, '💎':{3:15,4:50,5:150}, '7️⃣':{3:25,4:80,5:250}, '⭐':{3:0,4:0,5:0} };
const FREE_SPINS = {3:8, 4:15, 5:25};
const REELS_N = 5, ROWS = 3;
let spinning = false, freeSpins = 0, autoOn = false, autoLeft = 0;

function weightedRand(){
  const tot=WEIGHTS.reduce((a,b)=>a+b,0); let r=Math.random()*tot;
  for(let i=0;i<SYMS.length;i++){r-=WEIGHTS[i];if(r<=0)return SYMS[i];}
  return SYMS[0];
}

function buildReels(){
  const c=document.getElementById('reels'); c.innerHTML='';
  for(let i=0;i<REELS_N;i++){
    const rd=document.createElement('div'); rd.className='reel';
    const strip=document.createElement('div'); strip.className='reel-strip'; strip.id='strip'+i;
    for(let r=0;r<ROWS;r++){
      const s=document.createElement('div'); s.className='sym'; s.textContent=weightedRand(); strip.appendChild(s);
    }
    rd.appendChild(strip); c.appendChild(rd);
  }
}

function buildPaytable(){
  const pt=document.getElementById('paytable'); pt.innerHTML='';
  SYMS.forEach(s=>{
    if(s==='⭐'){pt.innerHTML+=`<div class="pi">⭐ 3=<em>8 FS</em> 4=<em>15 FS</em> 5=<em>25 FS</em></div>`;return;}
    const p=PAYS[s]; pt.innerHTML+=`<div class="pi">${s} 3=<em>${p[3]}×</em> 4=<em>${p[4]}×</em> 5=<em>${p[5]}×</em></div>`;
  });
}

function spin(){
  if(!requireLogin()) return;
  if(spinning) return;
  const bet=parseFloat(document.getElementById('betInp').value);
  if(!bet||bet<=0){shakeEl(document.getElementById('betInp'));return;}
  const isFree=freeSpins>0;
  if(!isFree){
    if(!Wallet.subtract(bet)){Toast.show('⚠️','Insufficient Balance','','error');shakeEl(document.getElementById('betInp'));return;}
  } else { freeSpins--; document.getElementById('freeDisp').textContent=freeSpins; }
  spinning=true;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('winBanner').classList.remove('show');
  setStatus(isFree?`🎁 Free spin! (${freeSpins} left)`:'Spinning...','');

  const results=[];
  for(let i=0;i<REELS_N;i++){
    const col=[]; for(let r=0;r<ROWS;r++) col.push(weightedRand());
    results.push(col);
  }

  animateReels(results, ()=>{
    const mid=results.map(c=>c[1]);
    let winAmt=0, winMsg='';
    
    // Check for matching symbols from left
    let i=0;
    while(i<REELS_N){
      const s=mid[i]; let count=1;
      for(let j=i+1;j<REELS_N;j++){if(mid[j]===s)count++;else break;}
      if(count>=3&&s!=='⭐'&&PAYS[s]&&PAYS[s][count]){
        const p=PAYS[s][count]; winAmt+=bet*p;
        winMsg+=`${s}×${count} = ${p}× `;
      }
      i++;
    }

    // Better matching: count consecutive from left for each symbol
    winAmt=0; winMsg='';
    const firstSym=mid[0]; let consec=1;
    for(let j=1;j<REELS_N;j++){if(mid[j]===firstSym)consec++;else break;}
    if(consec>=3&&firstSym!=='⭐'&&PAYS[firstSym]&&PAYS[firstSym][consec]){
      winAmt=bet*PAYS[firstSym][consec];
      winMsg=`${firstSym}×${consec} = ${PAYS[firstSym][consec]}×`;
    }

    // Scatter count
    const scCount=mid.filter(s=>s==='⭐').length;
    if(scCount>=3){
      const fs=FREE_SPINS[Math.min(scCount,5)];
      freeSpins+=fs;
      document.getElementById('freeDisp').textContent=freeSpins;
      winMsg+=(winMsg?' + ':'')+`⭐×${scCount} = ${fs} Free Spins!`;
    }

    if(winAmt>0){
      Wallet.add(winAmt); SFX.play('win'); FX.fireworks();
      document.getElementById('wbAmt').textContent='+'+Wallet.fmt(winAmt);
      document.getElementById('wbSub').textContent=winMsg;
      document.getElementById('winBanner').classList.add('show');
      setStatus('🎉 '+winMsg,'won');
      setTimeout(()=>document.getElementById('winBanner').classList.remove('show'),2000);
    } else if(scCount>=3){
      SFX.play('win');
      setStatus('🎁 '+winMsg,'won');
    } else {
      setStatus(isFree?'No win this spin':'No match. Try again!','');
    }

    spinning=false;
    document.getElementById('spinBtn').disabled=false;

    if(autoOn&&autoLeft>0){
      autoLeft--;
      if(autoLeft<=0){autoOn=false;document.getElementById('autoBtn').textContent='▶ AUTO';return;}
      if(freeSpins>0||Wallet.get()>=bet) setTimeout(spin,600);
      else{autoOn=false;document.getElementById('autoBtn').textContent='▶ AUTO';}
    } else if(freeSpins>0){ setTimeout(spin,800); }
  });
}

function animateReels(results, cb){
  let done=0;
  for(let i=0;i<REELS_N;i++){
    setTimeout(()=>{
      SFX.play('tick');
      const strip=document.getElementById('strip'+i);
      strip.innerHTML='';
      const extra=8+i*3;
      const all=[];
      for(let e=0;e<extra;e++) all.push(weightedRand());
      results[i].forEach(s=>all.push(s));
      all.forEach(s=>{const d=document.createElement('div');d.className='sym';d.textContent=s;strip.appendChild(d);});
      const totalH=all.length*60;
      strip.style.transition='none';
      strip.style.transform=`translateY(0)`;
      requestAnimationFrame(()=>{requestAnimationFrame(()=>{
        strip.style.transition=`transform ${0.4+i*0.15}s cubic-bezier(.2,.8,.3,1)`;
        strip.style.transform=`translateY(-${totalH-ROWS*60}px)`;
      });});
      setTimeout(()=>{ done++; if(done===REELS_N) cb(); }, (0.4+i*0.15)*1000+100);
    }, i*120);
  }
}

function setStatus(t,c){ const e=document.getElementById('status'); e.textContent=t; e.className='board-status '+(c||''); }

function bq(a){
  if(spinning)return;
  const el=document.getElementById('betInp');let v=parseFloat(el.value)||5;
  if(a==='h')v=Math.max(1,Math.floor(v/2));else if(a==='2')v=Math.min(Wallet.get(),v*2);else if(a==='min')v=1;else if(a==='max')v=Wallet.get();
  el.value=Math.round(v*100)/100;
}

function toggleAuto(){
  if(autoOn){ autoOn=false; autoLeft=0; document.getElementById('autoBtn').textContent='▶ AUTO'; return; }
  autoLeft=parseInt(document.getElementById('autoCount').value)||10;
  autoOn=true; document.getElementById('autoBtn').textContent='⏸ STOP';
  if(!spinning) spin();
}

buildReels(); buildPaytable();
</script>
</body>
