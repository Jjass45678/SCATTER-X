    .crash-mult.boom { color:var(--mine); text-shadow:0 0 20px rgba(255,59,92,.6), 0 0 60px rgba(255,59,92,.2); animation: shake .5s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 10%{transform:translateX(-6px)} 20%{transform:translateX(6px)} 30%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 50%{transform:translateX(-2px)} 60%{transform:translateX(2px)} }

    .live-bar { display:flex; gap:6px; width:100%; max-width:560px; overflow-x:auto; padding:6px 2px; scrollbar-width:thin; }

    .hb.g { background:rgba(0,245,160,.1); color:var(--gem); } .hb.r { background:rgba(255,59,92,.1); color:var(--mine); }
    .auto-lbl { font-size:.72rem; color:var(--muted); margin-top:4px; }

<script src="../js/wallet.js"></script>

<script>
Wallet.init();
updateAuthUI();

const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
let dpr, W, H;
function resizeCvs(){ dpr=window.devicePixelRatio||1; const r=cvs.getBoundingClientRect(); W=r.width; H=r.height; cvs.width=W*dpr; cvs.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
window.addEventListener('resize', resizeCvs); resizeCvs();

const St = { IDLE:0, COUNT:1, FLY:2, CRASH:3 };
let state=St.IDLE, curMult=1, crashPt, startTime, betAmt=0, betPlaced=false, cashedOut=false, countLeft=0;
const history=[], fakePlayers=[];

function genCrash(){
  const r=Math.random();
  // 8% chance of instant crash (1.00x-1.20x) for excitement
  if(r<.08) return 1+Math.random()*0.2;
  // 15% chance of early crash (1.20x-1.80x)
  if(r<.23) return 1.2+Math.random()*0.6;
  // Normal distribution for the rest
  return Math.max(1, 1/(1-r)*0.97);
}

function genFakes(){
  fakePlayers.length=0;
  const names=['Player_X','G_Cash','miner42','RizalPH','lucky777','crash_king','JuanBet','manila99','QuickPay','BetaMax'];
  for(let i=0;i<5+Math.floor(Math.random()*5);i++){
    fakePlayers.push({ name:names[Math.floor(Math.random()*names.length)], bet:Math.round((10+Math.random()*490)*100)/100, cashAt:(1+Math.random()*(crashPt-1)*.9+.2), cashed:false });
  }
}

function placeBet(){
  if(!requireLogin()) return;
  if(state!==St.IDLE) return;
  betAmt=parseFloat(document.getElementById('betInp').value);
  if(!betAmt||betAmt<=0){shakeEl(document.getElementById('betInp'));return;}
  if(!Wallet.subtract(betAmt)){Toast.show('⚠️','Insufficient Balance','','error');shakeEl(document.getElementById('betInp'));return;}
  betPlaced=true; cashedOut=false;
  document.getElementById('playBtn').disabled=true;
  document.getElementById('betInp').disabled=true;
  startRound();
}

function startRound(){
  crashPt=genCrash(); genFakes(); curMult=1;
  state=St.COUNT; countLeft=1;
  updateLive();
  const ci=setInterval(()=>{
    if(countLeft<=0){ clearInterval(ci); state=St.FLY; startTime=performance.now(); updateUI(); fly(); return; }
    setDisp(countLeft+'...','idle'); countLeft--;
  },500);
  setDisp('GO!','idle');
}

function fly(){
  if(state!==St.FLY) return;
  const el=(performance.now()-startTime)/1000;
  curMult=Math.pow(Math.E, 0.18*el);
  if(curMult>=crashPt){ curMult=crashPt; state=St.CRASH; drawGraph(); onCrash(); return; }
  const autoV=parseFloat(document.getElementById('autoInp').value);
  if(betPlaced&&!cashedOut&&autoV>0&&curMult>=autoV){ doCash(); }
  fakePlayers.forEach(p=>{ if(!p.cashed&&curMult>=p.cashAt){ p.cashed=true; } });
  updateLive(); drawGraph(); setDisp(curMult.toFixed(2)+'×','rise');
  requestAnimationFrame(fly);
}

function onCrash(){
  SFX.play('crash');
  triggerShake();
  setDisp(crashPt.toFixed(2)+'×','boom');
  setStatus('Crashed at '+crashPt.toFixed(2)+'×!','lost');
  history.unshift(crashPt); if(history.length>20) history.pop();
  renderHist(); updateLive();
  if(betPlaced&&!cashedOut){
    document.getElementById('ovLA').textContent='-'+Wallet.fmt(betAmt);
    document.getElementById('ovLS').textContent='Crashed at '+crashPt.toFixed(2)+'×';
    setTimeout(()=>document.getElementById('ovLose').classList.add('show'),400);
  }
  setTimeout(()=>{ state=St.IDLE; betPlaced=false; document.getElementById('playBtn').disabled=false; document.getElementById('betInp').disabled=false; document.getElementById('cashBtn').disabled=true; setDisp('1.00×','idle'); setStatus('Place a bet to join!',''); }, 2500);
}

function doCash(){
  if(!betPlaced||cashedOut||state!==St.FLY) return;
  cashedOut=true; const win=betAmt*curMult;
  Wallet.add(win); SFX.play('win'); FX.fireworks();
  document.getElementById('cashBtn').disabled=true;
  document.getElementById('ovWA').textContent='+'+Wallet.fmt(win);
  document.getElementById('ovWS').textContent=curMult.toFixed(2)+'× on '+Wallet.fmt(betAmt);
  setTimeout(()=>document.getElementById('ovWin').classList.add('show'),300);
}

function updateUI(){
  document.getElementById('cashBtn').disabled=!(betPlaced&&!cashedOut&&state===St.FLY);
}

// Star field
const stars=[];for(let i=0;i<80;i++){stars.push({x:Math.random(),y:Math.random(),s:0.3+Math.random()*1.5,b:0.15+Math.random()*0.7});}

// Exhaust particles
const exhaust=[];
function spawnExhaust(x,y,crashed){
  for(let i=0;i<3;i++){
    exhaust.push({x:x+(Math.random()-0.5)*6,y:y+8,vx:(Math.random()-0.5)*2,vy:1+Math.random()*3,life:1,
      color:crashed?'#ff3b5c':(['#f5c842','#ff6b00','#fff','#00f5a0'])[Math.floor(Math.random()*4)],size:1.5+Math.random()*3});
  }
}
function updateExhaust(){
  for(let i=exhaust.length-1;i>=0;i--){
    const p=exhaust[i]; p.x+=p.vx; p.y+=p.vy; p.life-=0.03; p.size*=0.97;
    if(p.life<=0) exhaust.splice(i,1);
  }
}
function drawExhaust(){
  exhaust.forEach(p=>{
    ctx.globalAlpha=p.life*0.7;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

// Explosion particles
const explosionParts=[];
function spawnExplosion(x,y){
  for(let i=0;i<40;i++){
    const angle=Math.random()*Math.PI*2, speed=2+Math.random()*6;
    explosionParts.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,
      color:(['#ff3b5c','#ff6b00','#f5c842','#fff'])[Math.floor(Math.random()*4)],size:2+Math.random()*4});
  }
}
function updateExplosion(){
  for(let i=explosionParts.length-1;i>=0;i--){
    const p=explosionParts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=0.02; p.size*=0.98;
    if(p.life<=0) explosionParts.splice(i,1);
  }
}
function drawExplosion(){
  explosionParts.forEach(p=>{
    ctx.globalAlpha=p.life*0.8;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

// Zigzag offset for rocket path
function zigzag(t){
  return Math.sin(t*4.5)*12*Math.min(1,t*0.3);
}

// Screen shake
let shakeAmt=0;
function triggerShake(){ shakeAmt=8; }
function getShake(){ if(shakeAmt<=0)return{x:0,y:0}; shakeAmt*=0.9; if(shakeAmt<0.3)shakeAmt=0; return{x:(Math.random()-0.5)*shakeAmt,y:(Math.random()-0.5)*shakeAmt}; }

function drawRocket(x,y,crashed,angle){
  ctx.save();ctx.translate(x,y);
  if(angle)ctx.rotate(angle);
  const sc=crashed?1:1+Math.sin(performance.now()*0.005)*0.03;
  ctx.scale(sc,sc);
  if(!crashed){
    // Outer flame glow
    ctx.globalAlpha=0.15+Math.random()*0.1;
    ctx.fillStyle='#f5c842';
    ctx.beginPath();ctx.ellipse(0,18,8,14+Math.random()*8,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // Flame outer
    const fl=10+Math.random()*8;
    ctx.fillStyle='#ff6b00';
    ctx.beginPath();ctx.moveTo(-5,10);ctx.quadraticCurveTo(-3,10+fl*0.7,0,10+fl);ctx.quadraticCurveTo(3,10+fl*0.7,5,10);ctx.closePath();ctx.fill();
    // Flame mid
    ctx.fillStyle='#f5c842';
    ctx.beginPath();ctx.moveTo(-3.5,10);ctx.quadraticCurveTo(-2,10+fl*0.5,0,10+fl*0.7);ctx.quadraticCurveTo(2,10+fl*0.5,3.5,10);ctx.closePath();ctx.fill();
    // Flame core
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.moveTo(-1.5,10);ctx.quadraticCurveTo(0,10+fl*0.3,0,10+fl*0.4);ctx.quadraticCurveTo(0,10+fl*0.3,1.5,10);ctx.closePath();ctx.fill();
  }
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath();ctx.ellipse(2,9,7,3,0,0,Math.PI*2);ctx.fill();
  // Body gradient
  const bg=ctx.createLinearGradient(-7,0,7,0);
  bg.addColorStop(0,crashed?'#cc2040':'#d0d8e8');bg.addColorStop(0.5,crashed?'#ff3b5c':'#ffffff');bg.addColorStop(1,crashed?'#cc2040':'#c0c8d8');
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.moveTo(0,-18);ctx.bezierCurveTo(-3,-14,-7,-2,-7,8);ctx.lineTo(7,8);ctx.bezierCurveTo(7,-2,3,-14,0,-18);ctx.closePath();ctx.fill();
  ctx.strokeStyle=crashed?'#aa1830':'#9098a8';ctx.lineWidth=0.5;ctx.stroke();
  // Body stripes
  if(!crashed){
    ctx.fillStyle='rgba(0,245,160,.15)';ctx.fillRect(-6,0,12,2);
    ctx.fillStyle='rgba(255,59,92,.15)';ctx.fillRect(-6,3,12,2);
  }
  // Nose cone
  const ng=ctx.createLinearGradient(0,-18,0,-6);
  ng.addColorStop(0,crashed?'#dc2040':'#00f5a0');ng.addColorStop(1,crashed?'#aa1020':'#00d9e8');
  ctx.fillStyle=ng;
  ctx.beginPath();ctx.moveTo(0,-18);ctx.bezierCurveTo(-2,-15,-4,-10,-5,-6);ctx.lineTo(5,-6);ctx.bezierCurveTo(4,-10,2,-15,0,-18);ctx.closePath();ctx.fill();
  // Window
  ctx.fillStyle='#0a1430';ctx.beginPath();ctx.arc(0,-2,3.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=crashed?'#ff6b6b':'#4a90e2';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=crashed?'#ff6b6b':'#4a90e2';ctx.globalAlpha=0.3;ctx.beginPath();ctx.arc(0,-2,2.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  // Window shine
  ctx.fillStyle='#fff';ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(-1,-3.5,1.2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  // Fins
  const fg=crashed?'#dc2040':'#ff3b5c';
  ctx.fillStyle=fg;
  ctx.beginPath();ctx.moveTo(-7,5);ctx.lineTo(-12,12);ctx.lineTo(-10,13);ctx.lineTo(-7,8);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(7,5);ctx.lineTo(12,12);ctx.lineTo(10,13);ctx.lineTo(7,8);ctx.closePath();ctx.fill();
  // Fin accents
  ctx.fillStyle=crashed?'#aa1020':'#cc2040';
  ctx.beginPath();ctx.moveTo(-7,6);ctx.lineTo(-11,11);ctx.lineTo(-10,12);ctx.lineTo(-7,8);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(7,6);ctx.lineTo(11,11);ctx.lineTo(10,12);ctx.lineTo(7,8);ctx.closePath();ctx.fill();
  // Nozzle
  ctx.fillStyle=crashed?'#881020':'#555';
  ctx.fillRect(-3,8,6,3);
  // Rocket glow
  if(!crashed){
    ctx.globalAlpha=0.08;ctx.fillStyle='#00f5a0';
    ctx.beginPath();ctx.ellipse(0,-4,18,24,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawGraph(){
  const shake=getShake();
  ctx.save();ctx.translate(shake.x,shake.y);
  ctx.clearRect(-10,-10,W+20,H+20);
  // Deep space gradient
  const skyGrad=ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0,'#020510');skyGrad.addColorStop(1,'#0a0e1a');
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,H);
  // Stars background with parallax
  const now=performance.now();
  stars.forEach(s=>{
    const twinkle=0.4+0.6*Math.sin(now*0.001+s.x*100+s.y*50);
    ctx.globalAlpha=s.b*twinkle;
    ctx.fillStyle='#fff';
    const yOff=state===St.FLY?(now-startTime)*0.002*s.s:0;
    let sy=(s.y*H+yOff)%H;
    ctx.beginPath();ctx.arc(s.x*W,sy,s.s,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  const pad=40, gw=W-pad*2, gh=H-pad*2;
  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad+gh-gh*(i/4); ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(pad+gw,y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.font='10px Inter';ctx.textAlign='right';
    ctx.fillText((1+i*(Math.max(curMult,2)-1)/4).toFixed(1)+'×',pad-6,y+3);
  }
  // Build zigzag path points
  const pts=[];
  const maxT=Math.log(curMult)/0.18;
  for(let t=0;t<=maxT;t+=maxT/200){
    const m=Math.pow(Math.E,0.18*t);
    const baseX=pad+(t/Math.max(maxT,1))*gw;
    const baseY=pad+gh-((m-1)/Math.max(curMult-1,.01))*gh;
    const zz=zigzag(t);
    pts.push({x:baseX+zz,y:baseY,bx:baseX,by:baseY});
  }
  if(pts.length>1){
    // Area fill
    const grad=ctx.createLinearGradient(0,pad+gh,0,pad);
    if(state===St.CRASH){grad.addColorStop(0,'rgba(255,59,92,.0)');grad.addColorStop(1,'rgba(255,59,92,.15)');}
    else{grad.addColorStop(0,'rgba(0,245,160,.0)');grad.addColorStop(1,'rgba(0,245,160,.1)');}
    ctx.beginPath(); ctx.moveTo(pts[0].bx,pad+gh);
    pts.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.lineTo(pts[pts.length-1].bx,pad+gh); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
    // Trail glow (thick)
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.strokeStyle=state===St.CRASH?'rgba(255,59,92,.08)':'rgba(0,245,160,.06)'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.stroke();
    // Trail mid
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.strokeStyle=state===St.CRASH?'rgba(255,59,92,.15)':'rgba(0,245,160,.12)'; ctx.lineWidth=5; ctx.stroke();
    // Main line
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.strokeStyle=state===St.CRASH?'#ff3b5c':'#00f5a0'; ctx.lineWidth=2.5; ctx.stroke();
    // Dots along path
    if(state!==St.CRASH){
      for(let i=0;i<pts.length;i+=20){
        ctx.globalAlpha=0.2;ctx.fillStyle='#00f5a0';
        ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,2,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    // Rocket at tip
    const lp=pts[pts.length-1];
    const prev=pts[Math.max(0,pts.length-5)];
    const angle=Math.atan2(lp.y-prev.y,lp.x-prev.x)-Math.PI/2;
    // Spawn exhaust from rocket
    if(state===St.FLY) spawnExhaust(lp.x,lp.y,false);
    if(state===St.CRASH&&explosionParts.length===0) spawnExplosion(lp.x,lp.y);
    // Draw particles
    updateExhaust(); drawExhaust();
    updateExplosion(); drawExplosion();
    drawRocket(lp.x, lp.y, state===St.CRASH, state!==St.CRASH?angle:0);
    // Glow around rocket
    if(state!==St.CRASH){
      ctx.globalAlpha=0.06+Math.sin(now*0.003)*0.03;ctx.fillStyle='#00f5a0';
      ctx.beginPath();ctx.arc(lp.x,lp.y,22,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    }
  }
  ctx.restore();
}

function setDisp(t,c){ const e=document.getElementById('multDisp'); e.textContent=t; e.className='crash-mult '+c; }
function setStatus(t,c){ const e=document.getElementById('status'); e.textContent=t; e.className='board-status '+c; }

function renderHist(){
  const r=document.getElementById('histRow'); r.innerHTML='';
  history.slice(0,12).forEach(h=>{
    const d=document.createElement('div'); d.className='hb '+(h>=2?'g':'r'); d.textContent=h.toFixed(2)+'×'; r.appendChild(d);
  });
}

function updateLive(){
  const bar=document.getElementById('liveBar'); bar.innerHTML='';
  fakePlayers.forEach(p=>{
    const d=document.createElement('div'); d.className='lb '+(p.cashed?'won':'lost');
    d.innerHTML=`<span class="u">${p.name}</span><span class="m">${p.cashed?p.cashAt.toFixed(2)+'×':'—'}</span><span class="u">${Wallet.fmt(p.bet)}</span>`;
    bar.appendChild(d);
  });
  if(betPlaced){
    const d=document.createElement('div'); d.className='lb '+(cashedOut?'won':'');
    d.innerHTML=`<span class="u">You</span><span class="m">${cashedOut?curMult.toFixed(2)+'×':'—'}</span><span class="u">${Wallet.fmt(betAmt)}</span>`;
    bar.prepend(d);
  }
}

function bq(a){
  if(state!==St.IDLE)return;
  const el=document.getElementById('betInp');let v=parseFloat(el.value)||10;
  if(a==='h')v=Math.max(1,Math.floor(v/2));else if(a==='2')v=Math.min(Wallet.get(),v*2);else if(a==='min')v=1;else if(a==='max')v=Wallet.get();
  el.value=Math.round(v*100)/100;
}

function closeOv(){ document.getElementById('ovWin').classList.remove('show'); document.getElementById('ovLose').classList.remove('show'); }
