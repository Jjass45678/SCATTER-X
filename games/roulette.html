<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roulette — ScatterX</title>
  <link rel="stylesheet" href="../css/shared.css" />
  <style>
    .wheel-wrap { position:relative; width:300px; height:300px; margin:0 auto; }
    .wheel-wrap canvas { width:100%; height:100%; }
    .wheel-pointer { position:absolute; top:-10px; left:50%; transform:translateX(-50%); font-size:1.4rem; z-index:2; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
    .wheel-num { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-family:'Orbitron',sans-serif; font-size:1.8rem; font-weight:900; color:#fff; text-shadow:0 0 12px rgba(0,245,160,.3); z-index:2; }
    .bet-table { display:grid; grid-template-columns:repeat(13,1fr); gap:3px; width:100%; max-width:560px; }
    .bt-cell { border-radius:6px; text-align:center; font-size:.7rem; font-weight:700; padding:8px 2px; cursor:pointer; transition:all .15s; border:2px solid transparent; position:relative; user-select:none; }
    .bt-cell:hover { transform:scale(1.06); z-index:2; }
    .bt-cell.sel { border-color:#ffd700; box-shadow:0 0 10px rgba(255,215,0,.3); }
    .bt-red { background:rgba(220,50,50,.8); color:#fff; }
    .bt-black { background:rgba(40,40,40,.9); color:#fff; }
    .bt-green { background:rgba(0,140,60,.8); color:#fff; }
    .bt-out { background:var(--card); color:var(--muted); border:1px solid var(--border); font-size:.6rem; }
    .bt-out:hover { border-color:var(--gem); color:var(--gem); }
    .bt-out.sel { border-color:#ffd700; color:#ffd700; }
    .chip-row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
    .chip { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Orbitron',sans-serif; font-size:.65rem; font-weight:700; cursor:pointer; border:3px dashed rgba(255,255,255,.3); transition:all .15s; }
    .chip:hover { transform:scale(1.1); }
    .chip.c-sel { border-style:solid; border-color:#fff; box-shadow:0 0 12px rgba(255,255,255,.3); transform:scale(1.1); }
    .chip-1 { background:#3b82f6; color:#fff; }
    .chip-5 { background:#8b5cf6; color:#fff; }
    .chip-10 { background:#ef4444; color:#fff; }
    .chip-25 { background:#f59e0b; color:#000; }
    .chip-50 { background:#10b981; color:#fff; }
    .chip-100 { background:#ec4899; color:#fff; }
    .bets-display { display:flex; gap:6px; flex-wrap:wrap; }
    .bd-item { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:.65rem; color:var(--muted); }
    .bd-item em { color:var(--gem); font-style:normal; }
    .out-bets { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; width:100%; max-width:560px; }
    .result-num { font-family:'Orbitron',sans-serif; font-size:2rem; font-weight:900; text-align:center; margin:8px 0; }
    .hist-row { display:flex; gap:4px; flex-wrap:wrap; }
    .hd { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.55rem; font-weight:700; }
    .hd-r { background:rgba(220,50,50,.7); color:#fff; }
    .hd-b { background:rgba(40,40,40,.8); color:#fff; }
    .hd-g { background:rgba(0,140,60,.7); color:#fff; }
  </style>

<div class="page-wrap">
  <div class="game-layout">
    <div class="side">
      <div class="field-group">
        <div class="field-label">Chip Value</div>
        <div class="chip-row">
          <div class="chip chip-1 c-sel" onclick="selChip(1)">₱1</div>
          <div class="chip chip-5" onclick="selChip(5)">₱5</div>
          <div class="chip chip-10" onclick="selChip(10)">₱10</div>
          <div class="chip chip-25" onclick="selChip(25)">₱25</div>
          <div class="chip chip-50" onclick="selChip(50)">₱50</div>
          <div class="chip chip-100" onclick="selChip(100)">₱100</div>
        </div>
      </div>
      <div class="info-box">
        <div class="i-lbl">Total Bet</div>
        <div class="i-val" id="totalBet">₱0</div>
      </div>
      <button class="btn-primary" id="spinBtn" onclick="spinWheel()">🎡 SPIN</button>
      <button class="btn-outline" onclick="clearBets()">CLEAR BETS</button>
      <div class="field-group">
        <div class="field-label">Your Bets</div>
        <div class="bets-display" id="betsDisp"></div>
      </div>
      <div class="field-group">
        <div class="field-label">History</div>
        <div class="hist-row" id="histRow"></div>
      </div>
    </div>

    <div class="game-board">
      <div class="board-status" id="status">Place chips on the table, then spin!</div>
      <div class="wheel-wrap">
        <div class="wheel-pointer">▼</div>
        <div class="wheel-num" id="wheelNum">—</div>
        <canvas id="cvs" width="300" height="300"></canvas>
      </div>
      <div class="result-num" id="resultNum"></div>
      <div class="bet-table" id="betTable"></div>
      <div class="out-bets" id="outBets"></div>
    </div>
  </div>
</div>

<!-- Overlays -->
<div class="overlay" id="ovWin">
  <div class="overlay-box"><div class="overlay-icon">🏆</div><div class="overlay-title win">YOU WON!</div>
  <div class="overlay-amount win" id="ovWA">₱0</div><div class="overlay-sub" id="ovWS"></div>
  <button class="btn-primary" style="margin-top:10px" onclick="closeOv()">PLAY AGAIN</button></div>
</div>
<div class="overlay" id="ovLose">
  <div class="overlay-box"><div class="overlay-icon">😢</div><div class="overlay-title lose">NO WIN</div>
  <div class="overlay-amount lose" id="ovLA">-₱0</div><div class="overlay-sub" id="ovLS"></div>
  <button class="btn-red" style="margin-top:10px" onclick="closeOv()">TRY AGAIN</button></div>
</div>

<script src="../js/wallet.js"></script>
<script src="../js/auth.js"></script>
<script>
Wallet.init();
updateAuthUI();

const NUMS=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const REDS=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');
let chipVal=1, bets={}, spinning=false, angle=0, history=[];

function numColor(n){return n===0?'green':REDS.has(n)?'red':'black';}

function drawWheel(){
  const cx=150,cy=150,r=140;
  const seg=Math.PI*2/NUMS.length;
  NUMS.forEach((n,i)=>{
    const a=i*seg-Math.PI/2+angle;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+seg);ctx.closePath();
    const c=numColor(n);
    ctx.fillStyle=c==='red'?'#c0392b':c==='green'?'#27ae60':'#2c3e50';
    ctx.fill();ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a+seg/2);
    ctx.fillStyle='#fff';ctx.font='bold 10px Orbitron';ctx.textAlign='center';
    ctx.fillText(n,r-20,4);ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,30,0,Math.PI*2);
  ctx.fillStyle='#0a0e1a';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=2;ctx.stroke();
}

function buildTable(){
  const tbl=document.getElementById('betTable');tbl.innerHTML='';
  const d0=document.createElement('div');d0.className='bt-cell bt-green';d0.textContent='0';d0.style.gridRow='1/4';d0.onclick=()=>placeBet('n0');tbl.appendChild(d0);
  for(let r=0;r<3;r++){
    for(let c=0;c<12;c++){
      const n=c*3+(3-r);
      const d=document.createElement('div');d.className='bt-cell '+(numColor(n)==='red'?'bt-red':'bt-black');
      d.textContent=n;d.dataset.n=n;d.onclick=()=>placeBet('n'+n);tbl.appendChild(d);
    }
  }
  const ob=document.getElementById('outBets');ob.innerHTML='';
  const outside=[
    {id:'1st12',label:'1st 12'},{id:'2nd12',label:'2nd 12'},{id:'3rd12',label:'3rd 12'},
    {id:'1-18',label:'1-18'},{id:'even',label:'Even'},{id:'red',label:'🔴 Red'},
    {id:'black',label:'⚫ Black'},{id:'odd',label:'Odd'},{id:'19-36',label:'19-36'}
  ];
  outside.forEach(o=>{
    const d=document.createElement('div');d.className='bt-cell bt-out';d.textContent=o.label;d.onclick=()=>placeBet(o.id);ob.appendChild(d);
  });
}

function placeBet(id){
  if(!requireLogin()) return;
  if(spinning)return;
  if(Wallet.get()<chipVal){Toast.show('⚠️','Insufficient Balance','','error');return;}
  Wallet.subtract(chipVal);
  bets[id]=(bets[id]||0)+chipVal;
  SFX.play('click');
  updateBetsUI();
}

function updateBetsUI(){
  let total=0;Object.values(bets).forEach(v=>total+=v);
  document.getElementById('totalBet').textContent=Wallet.fmt(total);
  const disp=document.getElementById('betsDisp');disp.innerHTML='';
  Object.entries(bets).forEach(([k,v])=>{
    const d=document.createElement('div');d.className='bd-item';
    d.innerHTML=`${k.replace('n','')} → <em>${Wallet.fmt(v)}</em>`;disp.appendChild(d);
  });
  document.querySelectorAll('.bt-cell').forEach(c=>{
    const nAttr=c.dataset.n;
    if(nAttr!==undefined) c.classList.toggle('sel',!!bets['n'+nAttr]);
  });
}

function clearBets(){
  if(spinning)return;
  let total=0;Object.values(bets).forEach(v=>total+=v);
  if(total>0)Wallet.add(total);
  bets={};updateBetsUI();
}

function selChip(v){
  chipVal=v;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('c-sel',c.textContent.includes(v)));
}

function spinWheel(){
  if(spinning)return;
  const total=Object.values(bets).reduce((a,b)=>a+b,0);
  if(total===0){setStatus('Place at least one bet!',''); return;}
  spinning=true;document.getElementById('spinBtn').disabled=true;
  SFX.play('spin');

  const winIdx=Math.floor(Math.random()*NUMS.length);
  const winNum=NUMS[winIdx];
  const seg=Math.PI*2/NUMS.length;
  const targetAngle=Math.PI*2*5-(winIdx*seg-Math.PI/2);
  const startAngle=angle;
  const duration=4000;
  const start=performance.now();

  function animSpin(now){
    const el=Math.min((now-start)/duration,1);
    const ease=1-Math.pow(1-el,3);
    angle=startAngle+ease*(targetAngle-startAngle);
    ctx.clearRect(0,0,300,300);drawWheel();
    if(el>=0.5) SFX.play('tick');
    if(el<1){requestAnimationFrame(animSpin);}
    else{
      document.getElementById('wheelNum').textContent=winNum;
      resolve(winNum);
    }
  }
  requestAnimationFrame(animSpin);
}

function resolve(n){
  const c=numColor(n);
  history.unshift(n);if(history.length>20)history.pop();renderHist();

  const rn=document.getElementById('resultNum');
  rn.textContent=n;rn.style.color=c==='red'?'#e74c3c':c==='green'?'#27ae60':'#fff';

  let winTotal=0;
  Object.entries(bets).forEach(([k,v])=>{
    let mult=0;
    if(k==='n'+n) mult=n===0?35:35;
    else if(k==='red'&&c==='red') mult=1;
    else if(k==='black'&&c==='black') mult=1;
    else if(k==='even'&&n!==0&&n%2===0) mult=1;
    else if(k==='odd'&&n%2===1) mult=1;
    else if(k==='1-18'&&n>=1&&n<=18) mult=1;
    else if(k==='19-36'&&n>=19&&n<=36) mult=1;
    else if(k==='1st12'&&n>=1&&n<=12) mult=2;
    else if(k==='2nd12'&&n>=13&&n<=24) mult=2;
    else if(k==='3rd12'&&n>=25&&n<=36) mult=2;
    if(mult>0) winTotal+=v+v*mult;
  });

  const totalBet=Object.values(bets).reduce((a,b)=>a+b,0);

  if(winTotal>0){
    Wallet.add(winTotal);SFX.play('win');FX.fireworks();
    setStatus(`🏆 ${n} ${c==='red'?'🔴':c==='green'?'🟢':'⚫'} — Won ${Wallet.fmt(winTotal)}!`,'won');
    document.getElementById('ovWA').textContent='+'+Wallet.fmt(winTotal);
    document.getElementById('ovWS').textContent=`Number ${n} (${c}) · Bet: ${Wallet.fmt(totalBet)}`;
    setTimeout(()=>document.getElementById('ovWin').classList.add('show'),500);
  } else {
    SFX.play('crash');
    setStatus(`😢 ${n} ${c==='red'?'🔴':c==='green'?'🟢':'⚫'} — No win.`,'lost');
    document.getElementById('ovLA').textContent='-'+Wallet.fmt(totalBet);
    document.getElementById('ovLS').textContent=`Number ${n} (${c})`;
    setTimeout(()=>document.getElementById('ovLose').classList.add('show'),500);
  }

  bets={};updateBetsUI();
  spinning=false;document.getElementById('spinBtn').disabled=false;
}

function renderHist(){
  const r=document.getElementById('histRow');r.innerHTML='';
  history.forEach(n=>{
    const c=numColor(n);
    const d=document.createElement('div');d.className='hd hd-'+(c==='red'?'r':c==='green'?'g':'b');
    d.textContent=n;r.appendChild(d);
  });
}

function setStatus(t,c){const e=document.getElementById('status');e.textContent=t;e.className='board-status '+(c||'');}
function closeOv(){document.getElementById('ovWin').classList.remove('show');document.getElementById('ovLose').classList.remove('show');}

buildTable(); drawWheel();
</script>
</body>
