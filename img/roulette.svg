<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="whl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2040"/><stop offset="100%" stop-color="#0f1520"/></linearGradient>
    <filter id="wglow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="95" r="82" fill="none" stroke="#f5c842" stroke-width="3" opacity=".3"/>
  <circle cx="100" cy="95" r="78" fill="url(#whl)" stroke="#2a3058" stroke-width="1.5"/>
  <!-- Number segments (simplified) -->
  <g transform="translate(100,95)">
    <g transform="rotate(0)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#dc3232" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">32</text></g>
    <g transform="rotate(30)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#222" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">15</text></g>
    <g transform="rotate(60)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#dc3232" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">19</text></g>
    <g transform="rotate(90)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#222" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">4</text></g>
    <g transform="rotate(120)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#dc3232" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">21</text></g>
    <g transform="rotate(150)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#222" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">2</text></g>
    <g transform="rotate(180)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#008c3c" opacity=".9"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">0</text></g>
    <g transform="rotate(210)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#dc3232" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">26</text></g>
    <g transform="rotate(240)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#222" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">3</text></g>
    <g transform="rotate(270)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#dc3232" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">35</text></g>
    <g transform="rotate(300)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#222" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">12</text></g>
    <g transform="rotate(330)"><rect x="-6" y="-72" width="12" height="20" rx="2" fill="#dc3232" opacity=".8"/><text x="0" y="-57" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff">28</text></g>
  </g>
  <!-- Inner circle -->
  <circle cx="100" cy="95" r="42" fill="#0d1428" stroke="#3a4268" stroke-width="1"/>
  <!-- Center hub -->
  <circle cx="100" cy="95" r="16" fill="#1a2040" stroke="#f5c842" stroke-width="2"/>
  <circle cx="100" cy="95" r="6" fill="#f5c842" opacity=".6"/>
  <!-- Ball -->
  <circle cx="138" cy="40" r="6" fill="#fff" filter="url(#wglow)"/>
  <circle cx="136" cy="38" r="2" fill="#fff" opacity=".6"/>
  <!-- Ball trail -->
  <circle cx="148" cy="50" r="3" fill="#fff" opacity=".15"/>
  <circle cx="155" cy="62" r="2.5" fill="#fff" opacity=".1"/>
  <!-- 35x text -->
  <text x="100" y="192" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#f5c842" filter="url(#wglow)">35</text>
</svg>
