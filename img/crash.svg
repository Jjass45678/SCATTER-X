<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="rk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#d0d8e8"/></linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00f5a0"/><stop offset="100%" stop-color="#00d9e8"/></linearGradient>
    <linearGradient id="fl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5c842"/><stop offset="100%" stop-color="#ff6b00"/></linearGradient>
    <linearGradient id="fl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff6b00"/><stop offset="100%" stop-color="#ff3b5c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Stars -->
  <circle cx="30" cy="40" r="1.5" fill="#fff" opacity=".6"/><circle cx="170" cy="25" r="1" fill="#fff" opacity=".4"/>
  <circle cx="155" cy="70" r="1.5" fill="#fff" opacity=".5"/><circle cx="45" cy="120" r="1" fill="#fff" opacity=".3"/>
  <circle cx="175" cy="150" r="1.5" fill="#fff" opacity=".4"/><circle cx="20" cy="170" r="1" fill="#fff" opacity=".5"/>
  <circle cx="60" cy="30" r="1" fill="#fff" opacity=".3"/><circle cx="140" cy="180" r="1" fill="#fff" opacity=".4"/>
  <!-- Multiplier text -->
  <text x="100" y="185" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#00f5a0" filter="url(#glow)">12.45</text>
  <!-- Trajectory line (zigzag) -->
  <path d="M30 170 Q50 150 45 130 Q38 110 55 95 Q70 80 60 60 Q50 42 72 30 Q85 22 100 45" stroke="#00f5a0" stroke-width="2" fill="none" opacity=".3" stroke-dasharray="4 3"/>
  <!-- Outer flame glow -->
  <ellipse cx="100" cy="130" rx="14" ry="30" fill="#f5c842" opacity=".15" filter="url(#glow2)"/>
  <!-- Flame outer -->
  <path d="M90 105 Q92 130 88 145 Q100 155 112 145 Q108 130 110 105Z" fill="url(#fl2)" opacity=".8"/>
  <!-- Flame inner -->
  <path d="M94 105 Q96 125 93 138 Q100 144 107 138 Q104 125 106 105Z" fill="url(#fl1)" opacity=".9"/>
  <!-- Flame core -->
  <path d="M97 105 Q98 120 96 130 Q100 134 104 130 Q102 120 103 105Z" fill="#fff" opacity=".7"/>
  <!-- Rocket body -->
  <path d="M100 30 Q85 55 86 90 L86 105 L114 105 L114 90 Q115 55 100 30Z" fill="url(#rk)" stroke="#b0b8c8" stroke-width="1"/>
  <!-- Nose cone -->
  <path d="M100 30 Q90 50 88 65 L112 65 Q110 50 100 30Z" fill="url(#nose)"/>
  <!-- Window -->
  <circle cx="100" cy="78" r="8" fill="#1a2040" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="100" cy="78" r="5" fill="#4a90e2" opacity=".3"/>
  <circle cx="97" cy="75" r="2" fill="#fff" opacity=".5"/>
  <!-- Fins -->
  <path d="M86 95 L72 112 L78 115 L86 105Z" fill="#ff3b5c" stroke="#dc2040" stroke-width=".5"/>
  <path d="M114 95 L128 112 L122 115 L114 105Z" fill="#ff3b5c" stroke="#dc2040" stroke-width=".5"/>
  <!-- Rocket glow -->
  <ellipse cx="100" cy="65" rx="20" ry="30" fill="#00f5a0" opacity=".06" filter="url(#glow)"/>
</svg>
