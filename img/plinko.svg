<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f5c842"/><stop offset="100%" stop-color="#e8984a"/></linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gs"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Pegs grid -->
  <circle cx="100" cy="40" r="4" fill="#9b7fd4" opacity=".8"/>
  <circle cx="80" cy="60" r="4" fill="#9b7fd4" opacity=".7"/><circle cx="120" cy="60" r="4" fill="#9b7fd4" opacity=".7"/>
  <circle cx="60" cy="80" r="4" fill="#9b7fd4" opacity=".6"/><circle cx="100" cy="80" r="4" fill="#9b7fd4" opacity=".6"/><circle cx="140" cy="80" r="4" fill="#9b7fd4" opacity=".6"/>
  <circle cx="40" cy="100" r="4" fill="#9b7fd4" opacity=".5"/><circle cx="80" cy="100" r="4" fill="#9b7fd4" opacity=".5"/><circle cx="120" cy="100" r="4" fill="#9b7fd4" opacity=".5"/><circle cx="160" cy="100" r="4" fill="#9b7fd4" opacity=".5"/>
  <circle cx="30" cy="120" r="3.5" fill="#9b7fd4" opacity=".4"/><circle cx="60" cy="120" r="3.5" fill="#9b7fd4" opacity=".4"/><circle cx="90" cy="120" r="3.5" fill="#9b7fd4" opacity=".4"/><circle cx="120" cy="120" r="3.5" fill="#9b7fd4" opacity=".4"/><circle cx="150" cy="120" r="3.5" fill="#9b7fd4" opacity=".4"/><circle cx="170" cy="120" r="3.5" fill="#9b7fd4" opacity=".4"/>
  <!-- Ball trail -->
  <circle cx="100" cy="37" r="3" fill="#f5c842" opacity=".15"/><circle cx="88" cy="50" r="3.5" fill="#f5c842" opacity=".2"/><circle cx="75" cy="65" r="4" fill="#f5c842" opacity=".25"/><circle cx="85" cy="82" r="5" fill="#f5c842" opacity=".3"/>
  <!-- Ball path line -->
  <path d="M100 35 Q88 48 75 63 Q70 75 85 85 Q95 92 90 105" stroke="#f5c842" stroke-width="1.5" fill="none" opacity=".2" stroke-dasharray="3 2"/>
  <!-- Ball -->
  <circle cx="90" cy="105" r="9" fill="url(#ball)" filter="url(#g)"/>
  <circle cx="87" cy="102" r="3" fill="#fff" opacity=".4"/>
  <!-- Multiplier slots at bottom -->
  <rect x="15" y="150" width="24" height="30" rx="4" fill="#ff3b5c" opacity=".7"/><text x="27" y="170" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#fff">10x</text>
  <rect x="43" y="150" width="24" height="30" rx="4" fill="#00f5a0" opacity=".5"/><text x="55" y="170" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#fff">2x</text>
  <rect x="71" y="150" width="24" height="30" rx="4" fill="#4a90e2" opacity=".4"/><text x="83" y="170" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#fff">1x</text>
  <rect x="99" y="150" width="24" height="30" rx="4" fill="#4a90e2" opacity=".4"/><text x="111" y="170" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#fff">1x</text>
  <rect x="127" y="150" width="24" height="30" rx="4" fill="#00f5a0" opacity=".5"/><text x="139" y="170" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#fff">2x</text>
  <rect x="155" y="150" width="24" height="30" rx="4" fill="#ff3b5c" opacity=".7"/><text x="167" y="170" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#fff">10x</text>
  <!-- Glow on target slot -->
  <rect x="43" y="150" width="24" height="30" rx="4" fill="none" stroke="#00f5a0" stroke-width="2" filter="url(#gs)" opacity=".6"/>
</svg>
