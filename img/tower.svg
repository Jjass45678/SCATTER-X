<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5c842"/><stop offset="100%" stop-color="#ff6b00"/></linearGradient>
    <filter id="gw"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Tower structure -->
  <rect x="42" y="155" width="116" height="28" rx="6" fill="#1c2240" stroke="#2a3058" stroke-width="1.5"/>
  <rect x="48" y="125" width="104" height="28" rx="6" fill="#1c2240" stroke="#2a3058" stroke-width="1.5"/>
  <rect x="54" y="95" width="92" height="28" rx="6" fill="#1c2240" stroke="#2a3058" stroke-width="1.5"/>
  <rect x="60" y="65" width="80" height="28" rx="6" fill="#0a1a14" stroke="#00f5a0" stroke-width="1.5" filter="url(#gw)"/>
  <rect x="66" y="35" width="68" height="28" rx="6" fill="#1c2240" stroke="#2a3058" stroke-width="1.5" opacity=".4"/>
  <!-- Cleared floor markers -->
  <text x="100" y="174" text-anchor="middle" font-size="16"></text>
  <text x="100" y="144" text-anchor="middle" font-size="16"></text>
  <text x="100" y="114" text-anchor="middle" font-size="16"></text>
  <!-- Current floor - question marks -->
  <text x="80" y="84" text-anchor="middle" font-size="14" fill="#fff" opacity=".6">?</text>
  <text x="100" y="84" text-anchor="middle" font-size="14" fill="#fff" opacity=".6">?</text>
  <text x="120" y="84" text-anchor="middle" font-size="14" fill="#fff" opacity=".6">?</text>
  <!-- Locked floor -->
  <text x="100" y="54" text-anchor="middle" font-size="14" opacity=".3"></text>
  <!-- Floor numbers -->
  <text x="35" y="174" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#f5c842">1</text>
  <text x="41" y="144" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#f5c842">2</text>
  <text x="47" y="114" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#f5c842">3</text>
  <text x="53" y="84" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#00f5a0">4</text>
  <text x="59" y="54" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#555">5</text>
  <!-- Multipliers -->
  <text x="165" y="174" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="8" fill="#888">1.3</text>
  <text x="159" y="144" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="8" fill="#888">1.7</text>
  <text x="153" y="114" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="8" fill="#888">2.2</text>
  <text x="147" y="84" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="8" fill="#00f5a0">2.9</text>
  <text x="141" y="54" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="8" fill="#555">3.8</text>
  <!-- Crown at top -->
  <text x="100" y="25" text-anchor="middle" font-size="20"></text>
  <!-- Glow on current floor -->
  <rect x="60" y="65" width="80" height="28" rx="6" fill="none" stroke="#00f5a0" stroke-width="2" opacity=".3" filter="url(#gw)"/>
</svg>
