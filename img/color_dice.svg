<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a1230"/><stop offset="100%" stop-color="#0d0b1a"/></linearGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff3b5c"/><stop offset="100%" stop-color="#dc2040"/></linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4a90e2"/><stop offset="100%" stop-color="#2863b0"/></linearGradient>
    <linearGradient id="d3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f5c842"/><stop offset="100%" stop-color="#e8984a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.5"/></filter>
  </defs>
  <!-- Dice 1 (Red) -->
  <g filter="url(#shadow)" transform="translate(20,45) rotate(-15,40,40)">
    <rect x="5" y="5" width="80" height="80" rx="14" fill="url(#d1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="25" cy="25" r="7" fill="rgba(255,255,255,0.9)"/>
    <circle cx="65" cy="25" r="7" fill="rgba(255,255,255,0.9)"/>
    <circle cx="25" cy="65" r="7" fill="rgba(255,255,255,0.9)"/>
    <circle cx="65" cy="65" r="7" fill="rgba(255,255,255,0.9)"/>
    <circle cx="45" cy="45" r="7" fill="rgba(255,255,255,0.9)"/>
  </g>
  <!-- Dice 2 (Blue) -->
  <g filter="url(#shadow)" transform="translate(75,20) rotate(10,40,40)">
    <rect x="5" y="5" width="80" height="80" rx="14" fill="url(#d2)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="25" cy="25" r="7" fill="rgba(255,255,255,0.9)"/>
    <circle cx="65" cy="65" r="7" fill="rgba(255,255,255,0.9)"/>
    <circle cx="45" cy="45" r="7" fill="rgba(255,255,255,0.9)"/>
  </g>
  <!-- Dice 3 (Gold) -->
  <g filter="url(#shadow)" transform="translate(50,90) rotate(5,40,40)">
    <rect x="5" y="5" width="80" height="80" rx="14" fill="url(#d3)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="25" cy="25" r="7" fill="rgba(60,40,0,0.7)"/>
    <circle cx="65" cy="25" r="7" fill="rgba(60,40,0,0.7)"/>
    <circle cx="25" cy="65" r="7" fill="rgba(60,40,0,0.7)"/>
    <circle cx="65" cy="65" r="7" fill="rgba(60,40,0,0.7)"/>
    <circle cx="45" cy="45" r="7" fill="rgba(60,40,0,0.7)"/>
    <circle cx="25" cy="45" r="7" fill="rgba(60,40,0,0.7)"/>
  </g>
  <!-- Sparkles -->
  <g filter="url(#glow)" opacity="0.7">
    <circle cx="15" cy="25" r="2" fill="#fff"/>
    <circle cx="185" cy="35" r="2.5" fill="#f5c842"/>
    <circle cx="170" cy="170" r="2" fill="#00f5a0"/>
    <circle cx="25" cy="175" r="1.5" fill="#9b7fd4"/>
    <circle cx="100" cy="10" r="2" fill="#ff3b5c"/>
  </g>
</svg>
