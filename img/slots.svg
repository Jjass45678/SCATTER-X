<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="reel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c2240"/><stop offset="100%" stop-color="#151830"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f5c842"/><stop offset="100%" stop-color="#e8984a"/></linearGradient>
    <filter id="wg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Machine body -->
  <rect x="15" y="20" width="170" height="140" rx="14" fill="#0d1428" stroke="#2a3058" stroke-width="2"/>
  <!-- Reel windows -->
  <rect x="25" y="35" width="46" height="110" rx="8" fill="url(#reel)" stroke="#3a4268" stroke-width="1"/>
  <rect x="77" y="35" width="46" height="110" rx="8" fill="url(#reel)" stroke="#3a4268" stroke-width="1"/>
  <rect x="129" y="35" width="46" height="110" rx="8" fill="url(#reel)" stroke="#3a4268" stroke-width="1"/>
  <!-- Win line -->
  <line x1="20" y1="90" x2="180" y2="90" stroke="#f5c842" stroke-width="2" opacity=".4" stroke-dasharray="4 2"/>
  <!-- Symbols - top row (dimmed) -->
  <text x="48" y="60" text-anchor="middle" font-size="20" opacity=".3"></text>
  <text x="100" y="60" text-anchor="middle" font-size="20" opacity=".3"></text>
  <text x="152" y="60" text-anchor="middle" font-size="20" opacity=".3"></text>
  <!-- Symbols - middle row (winning line) -->
  <text x="48" y="97" text-anchor="middle" font-size="26"></text>
  <text x="100" y="97" text-anchor="middle" font-size="26"></text>
  <text x="152" y="97" text-anchor="middle" font-size="26"></text>
  <!-- Win glow on middle row -->
  <rect x="25" y="72" width="150" height="35" rx="4" fill="#00f5a0" opacity=".06" filter="url(#wg)"/>
  <!-- Symbols - bottom row (dimmed) -->
  <text x="48" y="133" text-anchor="middle" font-size="20" opacity=".3">7</text>
  <text x="100" y="133" text-anchor="middle" font-size="20" opacity=".3"></text>
  <text x="152" y="133" text-anchor="middle" font-size="20" opacity=".3"></text>
  <!-- SCATTER badge -->
  <rect x="50" y="165" width="100" height="24" rx="12" fill="url(#gold)"/>
  <text x="100" y="182" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#06070d">FREE SPINS!</text>
</svg>
